services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booknook
      POSTGRES_PASSWORD: booknook
      POSTGRES_DB: booknook
    ports:
      - "5432:5432"
    volumes:
      - booknook-pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booknook -d booknook"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  booknook-pg:
